name: Verify repair branches

on:
  push:
    branches: [dev, 'codex/**']
  # Run the full CI gate (migrations on the mock DB, then a migration-free
  # build) before changes reach either deployment branch. This workflow never deploys.
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # PostgreSQL and the CMS test process run INSIDE a single Docker container
    # with --network none. No host gateway, Docker socket, or production secrets.
    # Network-enabled steps above this barrier may only install/audit dependencies.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Test source-provenance validator and bind CI merge to PR head
        env:
          HLS_EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test scripts/ci/release-provenance.test.mjs
          node scripts/ci/release-provenance.mjs --verify

      # D4/SD2 guard #1: no real-credential fingerprints may live in workflows.
      # HOST-AWARE (P17): a real leaked credential necessarily carries its real
      # provider host, so postgres URIs trip only on actual infra domains —
      # placeholder/mock hosts and documentation text stay clean. The AWS key
      # check excludes only Amazon's canonical sixteen-character doc example.
      # Comments in these files must DESCRIBE credential shapes, never quote a
      # full matching literal (that is what tripped run #34).
      - name: Secret-pattern guard (workflows)
        run: |
          set -e
          PATTERNS='postgres(ql)?://[^[:space:]"]+@[a-zA-Z0-9.-]*(supabase\.co|neon\.tech|rds\.amazonaws\.com|azure|render\.com|railway|digitalocean)|sk-[A-Za-z0-9]{20,}|AKIA(?!IOSFODNN7EXAMPLE)[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----(\\\\n|\n|\r|[A-Za-z0-9+/=]){40,}'
          if grep -rPzn -e "$PATTERNS" .github/workflows/; then
            echo '::error::Real-credential fingerprint found in workflow files (SD2).'
            exit 1
          fi
          echo 'Workflows clean: no real-provider credentials present.'

      # Safety-test the opt-in external staging probe using mocks only.
      - name: Verify read-only Hostinger staging preflight (no network)
        run: node --test scripts/ci/hostinger-staging-preflight.test.mjs

      # Offline-only migration ledger comparator: no database credentials or I/O.
      - name: Verify migration ledger preflight (synthetic fixtures only)
        run: node --test scripts/ci/migration-ledger-audit.test.mjs

      - run: npm ci

      - name: Domain check
        run: npm run check:domain

      - name: Type check
        run: npx tsc --noEmit

      - name: Native GraphQL scalar ESM and CJS compatibility
        run: node scripts/ci/graphql-scalars-compat.mjs

      - name: Security release gate
        run: npm run security:check

      # Regression guard (static, no DB): block any NEW localization migration
      # that drops a base column without backfilling its _locales table — the
      # exact footgun behind the Phase-15 title/excerpt loss (20260711_184910).
      - name: Migration safety lint
        run: node scripts/ci/migration-safety-lint.ts

      - name: Verify isolated CI contract (static preflight)
        run: node --test scripts/ci/test-offline-ci-contract.mjs

      - name: Run real PostgreSQL and runtime tests without external networking
        # Docker build prepares Node 22 + PostgreSQL 16 BEFORE entering the
        # network namespace. All migrations, tests, backup, build and smoke
        # then execute with only loopback enabled in docker --network none.
        run: bash scripts/ci/run-offline-postgres.sh full

      # Build output exists only INSIDE the offline Docker runtime.
      # The required secret-pattern gate runs there immediately after npm run build:ci.
      # Never claim a host .next/ scan when the host did not build those artifacts.

      - name: Generate hash-only release traceability evidence (not a deploy)
        env:
          HLS_EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/release-provenance.mjs --write

      - name: Archive non-production provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: cms-source-provenance-${{ github.run_id }}
          path: .ci-artifacts/release-provenance.json
          if-no-files-found: error
          retention-days: 14
