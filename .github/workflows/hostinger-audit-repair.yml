name: Verify and lock Hostinger security dependency repair
on:
  push:
    branches:
      - fix/hostinger-prebuild-audit-20261027
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/hostinger-audit-repair.yml
permissions:
  contents: write
jobs:
  verify-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation and storage integrity
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run security:verify-storage
      - name: Strict production security gate (do not bypass)
        run: npm audit --audit-level=high
      - name: Validate scripts and TypeScript
        run: |
          npm run check:domain
          npx tsc --noEmit
      - name: Run CMS regression tests
        run: npm test
      - name: Verify real Hostinger prebuild command with isolated test config
        run: npm run prebuild
      - name: Commit lockfile only after every prior gate passes
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(lock): resolve patched CMS security dependencies"
            git push origin HEAD:fix/hostinger-prebuild-audit-20261027
          fi
