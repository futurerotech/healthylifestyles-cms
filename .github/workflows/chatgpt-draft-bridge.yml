name: Review draft-only ChatGPT MCP bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/chatgptDraftPolicy.ts'
      - 'src/app/api/chatgpt-drafts/**'
      - 'tests/chatgptDraftPolicy.node-tests.mjs'
      - 'integrations/chatgpt-payload-mcp/**'
      - '.github/workflows/chatgpt-draft-bridge.yml'

permissions:
  contents: read

jobs:
  draft-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test tests/chatgptDraftPolicy.node-tests.mjs
      - run: node --experimental-strip-types --check src/app/api/chatgpt-drafts/route.ts
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/chatgpt-payload-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir=.wrangler/bridge-review
